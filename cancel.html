<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="logo.png">
  <title>Payment Cancelled · PayPoint</title>
  <link rel="stylesheet" href="mobile.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HFJ9JM358E"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-HFJ9JM358E');
</script>
  <style>
    body{font-family:Inter,system-ui,Arial;background:#0A0E1A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#071029;padding:28px;border-radius:12px;max-width:640px;text-align:center;border:1px solid rgba(255,255,255,0.04)}
    a.button{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:8px;background:#ef4444;color:#fff;text-decoration:none;font-weight:700}
    .muted{color:#94A3B8}
  </style>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="card">
    <h1>Payment Cancelled</h1>
    <p class="muted">The payment was cancelled or not completed. You can try again from your dashboard.</p>
    <a class="button" href="/dashboard.html">Return to dashboard</a>
  </div>
  <!-- Mobile Bottom Navigation -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="active">   <!-- change per page -->
        <span class="icon">
            <img src="chart-pie.png" alt="Dashboard" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='inline';">
            <span class="fallback" style="display:none;"><i class="fas fa-chart-pie"></i></span>
        </span>
        <span>Home</span>
    </a>
    <a href="deals.html">
        <span class="icon">
            <img src="handshake.png" alt="Deals" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='inline';">
            <span class="fallback" style="display:none;">🤝</span>
        </span>
        <span>Deals</span>
    </a>
    <a href="expense.html">
        <span class="icon">
            <img src="credit-card.png" alt="Expenses" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='inline';">
            <span class="fallback" style="display:none;"><i class="fas fa-credit-card"></i></span>
        </span>
        <span>Expenses</span>
    </a>
    <a href="invoice.html">
        <span class="icon">
            <img src="file-invoice.png" alt="Invoices" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='inline';">
            <span class="fallback" style="display:none;"><i class="fas fa-file-invoice"></i></span>
        </span>
        <span>Invoices</span>
    </a>
    <a href="creator.html">
        <span class="icon">
            <img src="user.png" alt="Profile" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='inline';">
            <span class="fallback" style="display:none;"><i class="fas fa-user"></i></span>
        </span>
        <span>Profile</span>
    </a>
</nav>
</nav>
</body>
</html>
