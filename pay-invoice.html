<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Invoice · PayPoint</title>
    <link rel="stylesheet" href="mobile.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F8FAFC;
            color: #000000;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payment-container {
            max-width: 480px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E8EDF2;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .payment-container h1 { font-size: 24px; font-weight: 700; color: #000000; }
        .payment-container p { color: #8A9AAB; font-size: 14px; margin: 8px 0 24px; }
        .btn-primary {
            background: #4F7CFF;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #FFFFFF;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 8px rgba(79, 124, 255, 0.25);
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #3A5FD9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { color: #4F7CFF; font-weight: 500; margin: 12px 0; }
        .error { color: #FF3B30; margin: 12px 0; }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>💰 Pay Invoice</h1>
        <p id="invoiceInfo">Loading invoice details...</p>
        <div id="loadingIndicator" class="loading">⏳ Loading...</div>
        <div id="errorMessage" class="error" style="display:none;"></div>
        <button class="btn-primary" id="payNowBtn" style="display:none;">
            💳 Proceed to Pay
        </button>
    </div>

    <script>
    const API_URL = window.__API_URL__ || (
        window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? '/api'
            : 'https://paypoint-7dmc.onrender.com/api'
    );
    const params = new URLSearchParams(window.location.search);
    const dealId = params.get('deal');

    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const payNowBtn = document.getElementById('payNowBtn');
    const invoiceInfo = document.getElementById('invoiceInfo');

    async function loadInvoice() {
        if (!dealId) {
            errorMessage.textContent = '❌ Invalid invoice link.';
            errorMessage.style.display = 'block';
            loadingIndicator.style.display = 'none';
            return;
        }

        try {
            const res = await fetch(`${API_URL}/public/deal/${dealId}`);
            const data = await res.json();

            if (!data.success || !data.data) {
                errorMessage.textContent = '❌ Invoice not found.';
                errorMessage.style.display = 'block';
                loadingIndicator.style.display = 'none';
                return;
            }

            const deal = data.data;
            const currencySymbol = deal.currency === 'USD' ? '$' : '₦';
            const formattedAmount = currencySymbol + Number(deal.amount).toLocaleString();

            invoiceInfo.innerHTML = `
                <strong>${deal.brand_name}</strong><br>
                Amount: <span style="font-size: 24px; font-weight: bold; color: #4F7CFF;">${formattedAmount}</span><br>
                Deliverable: ${deal.deliverable || 'Not specified'}<br>
                Due: ${deal.due_date ? new Date(deal.due_date).toLocaleDateString() : 'Not set'}
            `;

            loadingIndicator.style.display = 'none';
            payNowBtn.style.display = 'block';

        } catch (err) {
            errorMessage.textContent = '❌ Could not load invoice details. Please try again.';
            errorMessage.style.display = 'block';
            loadingIndicator.style.display = 'none';
        }
    }

    // Fetch creator's bank details
const bankRes = await fetch(`${API_URL}/profile/bank-details`, {
    credentials: 'include'
});
const bankData = await bankRes.json();

if (bankData.success && bankData.data && bankData.data.account_name) {
    invoiceInfo.innerHTML += `
        <div style="margin-top: 20px; padding: 16px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E8EDF2; text-align: left;">
            <h4 style="margin-bottom: 8px;">💳 Payment Instructions</h4>
            <p><strong>Account Name:</strong> ${bankData.data.account_name}</p>
            <p><strong>Bank:</strong> ${bankData.data.bank_name}</p>
            <p><strong>Account Number:</strong> ${bankData.data.account_number}</p>
            <p style="font-size: 12px; color: #8A9AAB; margin-top: 8px;">Please use the invoice number as your payment reference.</p>
        </div>
    `;
}

    loadInvoice();

    // Payment button handler (unchanged)
    payNowBtn.addEventListener('click', async () => {
        try {
            payNowBtn.disabled = true;
            payNowBtn.textContent = '⏳ Processing...';

            const token = localStorage.getItem('paypoint_session');
            const res = await fetch(`${API_URL}/payments/initialize`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify({
                    dealId: dealId,
                    email: 'customer@paypoint.com'
                })
            });

            const data = await res.json();

            if (data.success && data.authorization_url) {
                window.location.href = data.authorization_url;
            } else {
                errorMessage.textContent = '❌ ' + (data.error || 'Payment initialization failed');
                errorMessage.style.display = 'block';
                payNowBtn.disabled = false;
                payNowBtn.textContent = '💳 Proceed to Pay';
            }
        } catch (err) {
            errorMessage.textContent = '❌ Could not connect to server.';
            errorMessage.style.display = 'block';
            payNowBtn.disabled = false;
            payNowBtn.textContent = '💳 Proceed to Pay';
        }
    });
</script>
</body>
</html>
