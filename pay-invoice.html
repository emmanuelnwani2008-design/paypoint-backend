<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Invoice · PayPoint</title>
    <link rel="stylesheet" href="mobile.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F8FAFC;
            color: #000000;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payment-container {
            max-width: 480px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E8EDF2;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .payment-container h1 { font-size: 24px; font-weight: 700; color: #000000; }
        .payment-container p { color: #8A9AAB; font-size: 14px; margin: 8px 0 24px; }
        .btn-primary {
            background: #4F7CFF;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #FFFFFF;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 8px rgba(79, 124, 255, 0.25);
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #3A5FD9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { color: #4F7CFF; font-weight: 500; margin: 12px 0; }
        .error { color: #FF3B30; margin: 12px 0; }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1><i class="fas fa-money-bill-wave"></i> Pay Invoice</h1>
        <p id="invoiceInfo">Loading invoice details...</p>
        <div id="loadingIndicator" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        <div id="errorMessage" class="error" style="display:none;"></div>
        <button class="btn-primary" id="payNowBtn" style="display:none;"><i class="fas fa-credit-card"></i> Proceed to Pay</button>
    </div>

    <script>
    const API_URL = window.__API_URL__ || (window.location.hostname === 'localhost' ? '/api' : 'https://paypoint-7dmc.onrender.com/api');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const payNowBtn = document.getElementById('payNowBtn');
    const invoiceInfo = document.getElementById('invoiceInfo');

    async function loadInvoice() {
        if (!token) {
            errorMessage.textContent = '❌ Missing invoice token.';
            errorMessage.style.display = 'block';
            loadingIndicator.style.display = 'none';
            return;
        }

        try {
            const res = await fetch(`${API_URL}/public/invoice/${encodeURIComponent(token)}`);
            const data = await res.json();

            if (!data.success || !data.data) {
                errorMessage.textContent = '❌ Invoice not found or expired.';
                errorMessage.style.display = 'block';
                loadingIndicator.style.display = 'none';
                return;
            }

            const inv = data.data;
            const currencySymbol = inv.currency === 'USD' ? '$' : '₦';
            const formattedAmount = currencySymbol + Number(inv.amount).toLocaleString();

            // Build the bank details block
            let bankHtml = '';
            if (inv.bank_account_name && inv.bank_account_number) {
                bankHtml = `
                    <div style="margin-top: 20px; padding: 16px; background: #F8FAFC; border-radius: 8px; border: 1px solid #E8EDF2; text-align: left;">
                        <h4 style="margin-bottom: 8px;">💳 Payment Instructions (Bank Transfer)</h4>
                        <p><strong>Account Name:</strong> ${inv.bank_account_name}</p>
                        <p><strong>Bank:</strong> ${inv.bank_name}</p>
                        <p><strong>Account Number:</strong> ${inv.bank_account_number}</p>
                        <p style="font-size: 12px; color: #8A9AAB; margin-top: 8px;">${inv.payment_instructions || 'Please use the invoice number as reference.'}</p>
                    </div>
                `;
            } else {
                bankHtml = `<p style="color: #8A9AAB; margin-top: 16px;">The creator has not added payment details yet. Please contact them directly.</p>`;
            }

            // Invoice line items (if any)
            let itemsHtml = '';
            if (inv.line_items && inv.line_items.length > 0) {
                itemsHtml = '<ul style="list-style: none; padding: 0; margin: 12px 0;">';
                inv.line_items.forEach(item => {
                    itemsHtml += `<li style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee;">
                        <span>${item.description || 'Item'}</span>
                        <span>${currencySymbol}${Number(item.price * (item.quantity || 1)).toLocaleString()}</span>
                    </li>`;
                });
                itemsHtml += '</ul>';
            }

            invoiceInfo.innerHTML = `
                <div style="text-align: left;">
                    <p><strong>Invoice #:</strong> ${inv.invoice_number}</p>
                    <p><strong>Brand:</strong> ${inv.brand_name}</p>
                    <p><strong>Amount:</strong> <span style="font-size: 24px; font-weight: bold; color: #4F7CFF;">${formattedAmount}</span></p>
                    <p><strong>Due Date:</strong> ${inv.due_date ? new Date(inv.due_date).toLocaleDateString() : 'Not set'}</p>
                    ${itemsHtml}
                    ${inv.notes ? `<p><strong>Notes:</strong> ${inv.notes}</p>` : ''}
                    <p><strong>Status:</strong> ${inv.status.toUpperCase()}</p>
                </div>
                ${bankHtml}
            `;

            loadingIndicator.style.display = 'none';
            payNowBtn.style.display = 'block';

        } catch (err) {
            errorMessage.textContent = '❌ Could not load invoice details. Please try again.';
            errorMessage.style.display = 'block';
            loadingIndicator.style.display = 'none';
            console.error(err);
        }
    }

    // Payment button (optional – you could also just show bank details)
    payNowBtn.addEventListener('click', () => {
        // Since we're using bank transfer, we can simply show a message or copy details.
        alert('Please transfer the amount to the bank account shown above. Use the invoice number as reference.');
    });

    loadInvoice();
</script>
</body>
</html>
